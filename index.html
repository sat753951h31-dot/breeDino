<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreeDino</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="game-header">
  <h1 class="game-title">
    <span class="title-icon">🦖</span>
    <span class="title-bree">Bree</span><span class="title-dino">Dino</span>
    <span class="title-icon is-egg">🥚</span>
  </h1>
  <div class="game-subtitle">DINOSAUR BREEDING &amp; ADVENTURE</div>
</header>

<!-- スターター卵（未選択時のみ表示される） -->
<div id="starterEggArea"></div>

<!-- タブ切り替えボタン -->
<nav class="tab-nav">
  <button class="tab-btn active" data-tab="tab-explore">🧭 探索・育成</button>
  <button class="tab-btn" data-tab="tab-dinos">🦖 恐竜一覧</button>
  <button class="tab-btn" data-tab="tab-breed">🥚 交配・卵 <span id="breedTabBadge" class="tab-badge"></span></button>
  <button class="tab-btn" data-tab="tab-expedition">
    🏕️ 遠征 <span id="expTabBadge" class="tab-badge"></span>
  </button>
  <button class="tab-btn" data-tab="tab-facility">⛺ 設備</button>
  <button class="tab-btn" data-tab="tab-dex">📖 図鑑</button>
  <button class="tab-btn" data-tab="tab-records">🏆 実績・記録</button>
</nav>

<!-- ① 探索・育成タブ -->
<section id="tab-explore" class="tab-panel active">
  <div class="explore-layout">
    <!-- 左カード：相棒ステータス ＆ エサやり（育成セット） -->
    <div class="dashboard-card train-card">
      <div id="activeDino"></div>
      <div class="card-divider"></div>
      <h4>🍖 エサを与える</h4>
      <div id="foodStorage"></div>
    </div>

    <!-- 右カード：エリア探索 ＆ ログ（探索セット） -->
    <div class="dashboard-card adventure-card">
      <div class="adventure-header">
        <h3>🧭 フィールド探索</h3>
        <button
          id="typeChartBtn"
          type="button"
          class="btn-type-chart"
          title="三すくみ：🍖肉食 ＞ 🌿草食 ＞ 🦅翼竜 ＞ 🍖肉食（有利時：攻撃1.3倍・被ダメ40%軽減）／ 🌊海生：海エリアで1.35倍・陸で0.75倍"
        >
          📊 タイプ相性
        </button>
      </div>
      <div id="exploreAreaBox"></div>

      <div id="battleStage" class="battle-stage area-bg-1">
        <div class="stage-ground"></div>
        <div id="stageBanner" class="stage-banner">探索待機中</div>
        <div id="stagePlayer" class="stage-actor is-player"></div>
        <div id="stageEnemy" class="stage-actor is-enemy"></div>
        <div id="stageDamage" class="stage-damage"></div>
      </div>

      <div class="log-header">
        <h4>📜 探索ログ</h4>
        <button id="clearLogBtn" class="btn-clear-log" title="ログをすべて消去">🗑️ クリア</button>
      </div>
      <div id="huntLog" class="log-viewer"></div>
    </div>
  </div>
</section>

<!-- ② 恐竜一覧タブ -->
<section id="tab-dinos" class="tab-panel">
    <div class="dino-controls">
    <div class="control-item">
      <label for="filterName">🔍 名前・種族検索</label>
      <input type="text" id="filterName" placeholder="キーワードを入力...">
    </div>

    <div class="control-item">
      <label for="filterSpecies">🦖 種族絞り込み</label>
      <select id="filterSpecies">
        <option value="all">すべての種族</option>
      </select>
    </div>

    <div class="control-item">
      <label for="filterType">🏷️ タイプ絞り込み</label>
      <select id="filterType">
        <option value="all">すべてのタイプ</option>
        <option value="carnivore">🍖 肉食のみ</option>
        <option value="herbivore">🌿 草食のみ</option>
        <option value="pterosaur">🦅 翼竜のみ</option>
        <option value="marine">🌊 海生のみ</option>
      </select>
    </div>

    <div class="control-item">
      <label for="filterSex">⚥ 性別絞り込み</label>
      <select id="filterSex">
        <option value="all">すべて</option>
        <option value="male">♂️ オスのみ</option>
        <option value="female">♀️ メスのみ</option>
      </select>
    </div>

    <div class="control-item">
      <label for="filterRarity">✨ レア度絞り込み</label>
      <select id="filterRarity">
        <option value="all">すべてのレア度</option>
        <option value="rainbow">🌈 虹レアのみ</option>
        <option value="purple">🟣 紫レアのみ</option>
        <option value="blue">🔵 青レアのみ</option>
        <option value="white">⚪ 白レアのみ</option>
      </select>
    </div>

    <div class="control-item">
      <label for="filterGen">🧬 世代絞り込み</label>
      <select id="filterGen">
        <option value="all">すべての世代</option>
        <option value="0">F0 のみ（初代・野生）</option>
        <option value="1_plus">F1 以上（交配個体）</option>
        <option value="2_plus">F2 以上</option>
        <option value="5_plus">F5 以上</option>
      </select>
    </div>

    <div class="control-item">
      <label for="filterLock">🔒 ロック絞り込み</label>
      <select id="filterLock">
        <option value="all">すべて</option>
        <option value="locked">🔒 ロック中のみ</option>
        <option value="unlocked">🔓 未ロックのみ</option>
      </select>
    </div>

    <div class="control-item">
      <label for="sortBy">🔃 並び替え</label>
      <select id="sortBy">
        <option value="default">入手順（古い順）</option>
        <option value="newest">入手順（新しい順）</option>
        <option value="level">レベルが高い順</option>
        <option value="maxLevel">レベル上限が高い順</option>
        <option value="rarity">レア度が高い順</option>
        <option value="generation">世代（F）が高い順</option>
        <option value="iv">個体値（IV合計）が高い順</option>
      </select>
    </div>

    <div class="control-action">
      <button id="resetFilterBtn" class="btn-reset-filter" title="検索・絞り込み条件を初期化">🔄 リセット</button>
    </div>
  </div>

  <div class="bulk-release-bar">
    <label>
      🧹 一括整理対象:
      <select id="bulkReleaseCondition">
        <option value="white_f0">⚪ 白レア ＆ F0（世代0）のみ</option>
        <option value="white_all">⚪ 白レアすべて（全世代）</option>
        <option value="blue_f0">🔵 青レア以下 ＆ F0（世代0）のみ</option>
        <option value="blue_all">🔵 青レア以下すべて（全世代）</option>
        <option value="purple_f0">🟣 紫レア以下 ＆ F0（世代0）のみ</option>
        <option value="purple_all">🟣 紫レア以下すべて（全世代）</option>
      </select>
    </label>
    <button id="bulkReleaseBtn" class="btn-bulk-release">👋 条件に合う恐竜をまとめてお別れ</button>
    <span class="bulk-note">※育成中・交配選択中・🔒ロック中・ミュータント・特殊体色は自動で保護されます</span>
  </div>

  <div id="dinoList"></div>
</section>

<!-- ③ 交配・卵タブ -->
<section id="tab-breed" class="tab-panel">
  <div class="breeding-stage">
    <div class="breeding-header">
      <h2>🧬 恐竜交配</h2>
      <div class="header-help-btns">
        <button
          id="recipeListBtn"
          type="button"
          class="btn-help-pill is-recipe"
          title="特殊交配の組み合わせ早見表を表示"
        >
          🧬 特殊レシピ
        </button>
        <button
          type="button"
          class="btn-help-pill is-trait js-open-traits"
          title="すべての特性と効果の一覧を表示"
        >
          ✨ 特性一覧
        </button>
      </div>
    </div>
    <div id="parentInfo"></div>
    <div class="breed-btn-group">
      <button id="breedBtn" class="btn-breed-main" disabled>🥚 交配して卵を作る</button>
      <button id="breed10Btn" class="btn-breed-10" disabled>🥚 10回交配</button>
    </div>
  </div>

  <div class="eggs-section">
    <div class="wild-egg-header">
      <h3>⏳ 交配卵（孵化待ち）</h3>
      <button id="hatchAllBreedingBtn" class="btn-hatch-all" disabled>🐣 すべて孵化させる</button>
    </div>
    <div id="eggList"></div>

    <div class="wild-egg-header">
      <h3>🌿 野生の卵</h3>
      <button id="hatchAllWildBtn" class="btn-hatch-all" disabled>🐣 すべて孵化させる</button>
    </div>
    <div id="wildEggList"></div>
  </div>
</section>

<!-- ⑥ 遠征タブ（#tab-breed の下あたりに追加） -->
<section id="tab-expedition" class="tab-panel">
  <div id="activeExpeditions"></div>
  <div id="expeditionBuilder"></div>
  <h3>🦖 派遣可能な待機恐竜（クリックでメンバー選択）</h3>
  <div id="expeditionDinoGrid"></div>
</section>

<!-- ④ 図鑑タブ -->
<section id="tab-dex" class="tab-panel">
  <h2>恐竜図鑑</h2>
  <p id="dexCount"></p>
  <div id="dexList"></div>
</section>

<!-- ⑤ 実績・記録タブ（#tab-dex の下に追加） -->
<section id="tab-records" class="tab-panel">
  <h2>🏺 エリアの秘宝（パッシブ効果）</h2>
  <div id="treasureList"></div>
  
  <h2>📊 プレイレコード</h2>
  <div id="recordGrid"></div>

  <h2>🏆 実績一覧</h2>
  <p id="achievementCount"></p>
  <div id="achievementList"></div>
</section>

<!-- ⑦ 設備タブ（#tab-expedition の下あたりに追加） -->
<section id="tab-facility" class="tab-panel">
  <h2>⛺ 拠点の設備強化</h2>
  <p class="tab-desc">遠征で手に入る建築素材とお肉を納品して、拠点の施設をアップグレードできます。</p>
  <div id="materialStorage"></div>
  <div id="facilityList"></div>
</section>

<hr>
<footer class="footer-debug-bar">
  <button id="resetSave" class="btn-footer-reset">🗑️ セーブデータ初期化</button>
  <div class="footer-backup-group">
    <button id="exportSaveBtn" class="btn-footer-backup">📤 セーブ（書き出し）</button>
    <button id="importSaveBtn" class="btn-footer-backup">📥 ロード（読み込み）</button>
  </div>
</footer>

<!-- セーブ・ロード用モーダル（文字数制限なし） -->
<div id="backupModal" class="backup-modal" style="display: none;">
  <div class="backup-modal-content">
    <h3 id="backupModalTitle">📤 セーブデータの書き出し</h3>
    <p id="backupModalDesc" class="backup-modal-desc"></p>
    <textarea id="backupTextArea" rows="8" placeholder="ここにセーブ文字列を貼り付けてください..."></textarea>
    <div class="backup-modal-actions">
      <button id="backupCopyBtn" class="btn-footer-backup">📋 コピーする</button>
      <button id="backupExecLoadBtn" class="btn-upgrade">✅ このデータで復元する</button>
      <button id="backupCloseBtn" class="btn-footer-reset">閉じる</button>
    </div>
  </div>
</div>

<!-- 早見表用モーダル（特殊レシピ・特性一覧） -->
<div id="guideModal" class="backup-modal" style="display: none;">
  <div class="backup-modal-content guide-modal-content">
    <div class="guide-modal-header">
      <h3 id="guideModalTitle">📖 早見表</h3>
      <button id="guideCloseTopBtn" type="button" class="btn-footer-reset">✕ 閉じる</button>
    </div>
    <div id="guideModalBody" class="guide-modal-body"></div>
  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
